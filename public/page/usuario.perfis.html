GET /rbac/perfis - Listar todos
GET /rbac/perfis/:id - Listar por ID

PUT /rbac/perfis/:id - Alterar { nome, descricao }
DELETE /rbac/perfis/:id - Deletar

{
  "id": 1,
  "nome": "ADMINISTRADOR",

-->

<script>
    // ==================== ESCAPE HTML FUNCTION ====================
    // Função auxiliar para escapar HTML
    function escapeHtml(text) {

        // Tratar valores null, undefined ou vazios
        if (text === null || text === undefined) return '';
        if (text === '') return '';

        // Converter para string
        let str = String(text);

        // Remover caracteres de controle ASCII problemáticos (exceto tab, newline, carriage return)
        str = str.replace(/[\x00-\x08\x0B\x0C\x0E-\x1F\x7F-\x9F]/g, '');

        // Remover line separators e paragraph separators Unicode
        str = str.replace(/[\u2028\u2029]/g, '');

        // Mapa de caracteres especiais
        const map = {
            '&': '&amp;',
            '<': '&lt;',
            '>': '&gt;',
            '"': '&quot;',
            "'": '&#039;',
            '\n': '&#10;',
            '\r': '&#13;',
            '\t': '&#9;',
            '/': '&#47;',
            '\\': '&#92;'
        };

        // Substituir caracteres especiais
        return str.replace(/[&<>"'\n\r\t\/\\]/g, function (m) {
            return map[m];
        });
    }

    function labelMetodo(metodo) {
        const m = String(metodo || '').toUpperCase();
        if (m === 'GET') return 'ver';
        if (m === 'POST') return 'cadastrar';
        if (m === 'PUT') return 'alterar';
        if (m === 'DELETE') return 'deletar';
        return m.toLowerCase();
    }

    function ordemMetodo(metodo) {
        const m = String(metodo || '').toUpperCase();
        if (m === 'GET') return 1;
        if (m === 'POST') return 2;
        if (m === 'PUT') return 3;
        if (m === 'DELETE') return 4;
        return 99;
    }

    function normalizarRecurso(recurso) {
        return String(recurso || '')
            .toLowerCase()
            .normalize('NFD')
            .replace(/[\u0300-\u036f]/g, '')
            .replace(/[_\s]/g, '')
            .replace(/[^a-z0-9]/g, '');
    }

    function identificarGrupoSistema(recurso) {
        const norm = normalizarRecurso(recurso);
        if (norm.includes('usuario')) return 'usuarios';
        if (norm.includes('perfil') || norm.includes('acesso')) return 'controleacesso';
        if (norm.includes('config') || norm.includes('impressao')) return 'configuracoesimpressao';
        return null;
    }

    function tituloGrupoSistema(grupo) {
        if (grupo === 'usuarios') return 'Usuários';
        if (grupo === 'controleacesso') return 'Controle de Acesso';
        if (grupo === 'configuracoesimpressao') return 'Configurações de Impressão';
        return '';
    }

    function filtrarPermissoesConfig(permissoes) {
        // Para configurações de impressão: apenas GET (consultar) e PUT (alterar)
        // Remove POST (cadastrar), DELETE (deletar) e GET com "PorId" (consultarPorId)
        return permissoes.filter(p => {
            const metodo = String(p.metodo || '').toUpperCase();
            const codigo = String(p.codigo || '').toLowerCase();
            
            // Remove POST e DELETE
            if (metodo === 'POST' || metodo === 'DELETE') return false;
            
            // Remove GET com "porid" (consultarPorId)
            if (metodo === 'GET' && codigo.includes('porid')) return false;
            
            // Mantém GET (consultar) e PUT (alterar)
            return metodo === 'GET' || metodo === 'PUT';
        });
    }

    $(function () {
        try {

            // Capturar erros globais do jQuery
            $(document).ajaxError(function (event, jqxhr, settings, thrownError) {

            });

            let data;
            let table;
            let alterado = 0;
            let todasPermissoes = []; // Cache de todas as permissões
            let permissoesPerfilAtual = []; // Permissões do perfil atual
            let carregandoPermissoesPromise = null;
            let ordemChavesMenu = [];
            let ordemAcoesPorPrefixo = {};

            const SELECTORS = {
                tabelaPerfis: '#tabela-perfis',
                detalhesModal: '#detalhesModal',
                cadastrarModal: '#cadastrarModal',
                confirmacaoExclusaoModal: '#confirmacaoExclusaoModal',
                detalhesPerfil: '#detalhesPerfil',
                permissoesContainer: '#permissoesContainer',
                permissoesCadastroContainer: '#permissoesCadastroContainer',
                loadingPermissoes: '#loadingPermissoes',
                loadingPermissoesCadastro: '#loadingPermissoesCadastro',
                btnEditar: '#btnEditar',
                btnSalvar: '#btnSalvar',
                formCadastrarPerfil: '#formCadastrarPerfil',
                formEditarPerfil: '#formEditarPerfil'
            };

            const GRUPOS_SISTEMA = ['usuarios', 'controleacesso', 'configuracoesimpressao'];

            function getMensagemErro(result, fallback = 'Erro desconhecido.') {
                return result?.message || fallback;
            }

            function sanitizarPerfil(perfil) {
                return {
                    ...perfil,
                    nome: String(perfil.nome || '').trim(),
                    descricao: String(perfil.descricao || '').trim(),
                    id: perfil.id
                };
            }

            function getListaBasePermissoes() {
                return permissoesPerfilAtual.length > 0 ? permissoesPerfilAtual : todasPermissoes;
            }

            function exibirAlertaSemPermissoes(container) {
                const alert = $('<div>').addClass('alert alert-warning').text('Nenhuma permissão disponível no sistema.');
                container.empty().append(alert);
            }

            function alternarCheckboxesDoBloco(bloco, checkboxSelector, checked) {
                bloco.find(`${checkboxSelector}:enabled`).each(function () {
                    $(this).prop('checked', checked);
                    $(this).closest('.form-check').toggleClass('perm-selecionada', checked);
                });
            }

            function criarCampoDetalhes(config) {
                const wrapper = $('<div>').addClass('form-group mb-3');
                const label = $('<label>').attr('for', config.id).text(config.label);
                const campo = config.tag === 'textarea'
                    ? $('<textarea>')
                    : $('<input>').attr('type', config.type || 'text');

                campo
                    .addClass('form-control')
                    .attr('id', config.id)
                    .attr('name', config.name || config.id)
                    .prop('readonly', config.readonly !== false)
                    .prop('disabled', config.disabled !== false)
                    .attr('maxlength', config.maxlength || 255)
                    .val(config.value || '');

                if (config.required) campo.attr('required', true);
                if (config.rows) campo.attr('rows', config.rows);

                wrapper.append(label).append(campo);
                return wrapper;
            }

            function preencherDetalhesPerfil(perfil) {
                const nomeSeguro = String(perfil.nome || '').trim();
                const descricaoSegura = String(perfil.descricao || '').trim();
                const idSeguro = String(perfil.id || '');

                const inputId = $('<input>')
                    .attr('type', 'hidden')
                    .attr('id', 'id')
                    .attr('name', 'id')
                    .val(idSeguro);

                $(SELECTORS.detalhesPerfil)
                    .empty()
                    .append(criarCampoDetalhes({
                        id: 'nome',
                        label: 'Nome do Perfil:',
                        value: nomeSeguro,
                        required: true,
                        maxlength: 100
                    }))
                    .append(criarCampoDetalhes({
                        id: 'descricao',
                        label: 'Descrição:',
                        tag: 'textarea',
                        value: descricaoSegura,
                        rows: 3,
                        maxlength: 500
                    }))
                    .append(inputId);
            }

            function definirModoEdicaoDetalhes(estaEditando) {
                $(`${SELECTORS.detalhesModal} .form-control`)
                    .prop('readonly', !estaEditando)
                    .prop('disabled', !estaEditando);
                $(SELECTORS.btnEditar).toggleClass('d-none', estaEditando);
                $(SELECTORS.btnSalvar).toggleClass('d-none', !estaEditando);
            }

            function exibirErroPermissoesDetalhes() {
                $(SELECTORS.loadingPermissoes).hide();
                $(SELECTORS.permissoesContainer)
                    .html('<p class="text-danger">Erro ao carregar permissões.</p>')
                    .show();
            }

            function carregarPermissoesCadastro() {
                return carregarOrdemRecursosMenu()
                    .then(() => garantirTodasPermissoesCarregadas())
                    .then(() => carregarPermissoesDoPerfil(1))
                    .then(() => {
                        renderizarPermissoesCadastro();
                        $(SELECTORS.loadingPermissoesCadastro).hide();
                        $(SELECTORS.permissoesCadastroContainer).show();
                    });
            }

            function atualizarPerfilLocal(perfilId, dadosPerfil) {
                const perfilIndex = (data || []).findIndex(item => String(item.id) === String(perfilId));
                if (perfilIndex === -1) return;

                data[perfilIndex] = {
                    ...data[perfilIndex],
                    nome: String(dadosPerfil.nome || '').trim(),
                    descricao: String(dadosPerfil.descricao || '').trim()
                };
            }

            function recarregarTabelaPerfis() {
                return req_GET(opt.urlPerfis).then((res) => {
                    const perfis = res.data;
                    if (perfis && table) {
                        data = perfis.map(sanitizarPerfil);
                        table.clear().rows.add(data).draw();
                    } else {
                        console.error('Erro: Dados ou tabela não encontrados.');
                    }
                    alterado = 0;
                }).catch((error) => {
                    console.error('Erro ao fazer a requisição:', error);
                });
            }

            function sanitizarPermissao(permissao, recursoFallback = '') {
                return {
                    ...permissao,
                    id: Number(permissao.id),
                    codigo: String(permissao.codigo || '').trim(),
                    recurso: String(permissao.recurso || recursoFallback || '').trim(),
                    descricao: String(permissao.descricao || '').trim(),
                    metodo: String(permissao.metodo || '').trim(),
                    rota_template: String(permissao.rota_template || '').trim(),
                    vinculada: Boolean(permissao.vinculada)
                };
            }

            function normalizarListaPermissoes(data) {
                const flat = [];

                const adicionarPermissao = (permissao, recursoFallback = '') => {
                    if (!permissao || permissao.id == null) return;
                    flat.push(sanitizarPermissao(permissao, recursoFallback));
                };

                const visitar = (payload, recursoFallback = '') => {
                    if (!payload) return;

                    if (Array.isArray(payload)) {
                        payload.forEach(item => {
                            if (!item) return;

                            if (Array.isArray(item.permissoes)) {
                                const recurso = String(item.recurso || recursoFallback || '').trim();
                                item.permissoes.forEach(permissao => adicionarPermissao(permissao, recurso));
                                return;
                            }

                            if (Array.isArray(item.recursos)) {
                                visitar(item.recursos, recursoFallback);
                                return;
                            }

                            if (item.id != null || item.codigo || item.metodo || item.descricao) {
                                adicionarPermissao(item, recursoFallback);
                                return;
                            }

                            if (typeof item === 'object') {
                                visitar(item, recursoFallback);
                            }
                        });
                        return;
                    }

                    if (typeof payload === 'object') {
                        if (Array.isArray(payload.permissoes)) {
                            const recurso = String(payload.recurso || recursoFallback || '').trim();
                            payload.permissoes.forEach(permissao => adicionarPermissao(permissao, recurso));
                            return;
                        }

                        Object.entries(payload).forEach(([key, value]) => {
                            if (Array.isArray(value)) {
                                visitar(value, key);
                            }
                        });
                    }
                };

                visitar(data);

                return flat.filter((permissao, index, lista) => {
                    return lista.findIndex(item => item.id === permissao.id) === index;
                });
            }

            function extrairMapaPermissoesVinculadas(data) {
                const mapa = {};

                const visitar = (payload) => {
                    if (!payload) return;

                    if (Array.isArray(payload)) {
                        payload.forEach(item => {
                            if (!item) return;

                            if (Array.isArray(item.permissoes)) {
                                item.permissoes.forEach(permissao => {
                                    if (permissao && permissao.codigo) {
                                        mapa[String(permissao.codigo).trim()] = Boolean(permissao.vinculada ?? true);
                                    }
                                });
                                return;
                            }

                            if (Array.isArray(item.recursos)) {
                                visitar(item.recursos);
                                return;
                            }

                            if (item.codigo) {
                                mapa[String(item.codigo).trim()] = Boolean(item.vinculada ?? true);
                                return;
                            }

                            if (typeof item === 'object') {
                                visitar(item);
                            }
                        });
                        return;
                    }

                    if (typeof payload === 'object') {
                        Object.entries(payload).forEach(([key, value]) => {
                            if (typeof value === 'boolean' && key.includes(':')) {
                                mapa[String(key).trim()] = value;
                                return;
                            }

                            if (value && typeof value === 'object') {
                                visitar(value);
                            }
                        });
                    }
                };

                visitar(data);
                return mapa;
            }

            function garantirTodasPermissoesCarregadas() {
                if (todasPermissoes.length > 0) return Promise.resolve(todasPermissoes);
                if (!carregandoPermissoesPromise) {
                    carregandoPermissoesPromise = carregarTodasPermissoes().finally(() => {
                        carregandoPermissoesPromise = null;
                    });
                }
                return carregandoPermissoesPromise;
            }
            window.garantirTodasPermissoesCarregadas = garantirTodasPermissoesCarregadas;

            function carregarTodasPermissoes() {
                return req_GET(opt.urlPermissoes).then((result) => {

                    if (result.success && result.data) {
                        todasPermissoes = normalizarListaPermissoes(result.data);

                        return todasPermissoes;
                    }
                    todasPermissoes = [];
                    return [];
                }).catch(err => {
                    console.error('Erro ao carregar permissões:', err);
                    todasPermissoes = [];
                    return [];
                });
            }

            function carregarPermissoesDoPerfil(perfilId) {
                return req_GET(opt.urlPerfilPermissoes + '/' + perfilId).then((result) => {
                    if (result.success) {
                        permissoesPerfilAtual = normalizarPermissoesPerfil(result.data);
                        return permissoesPerfilAtual;
                    }
                    permissoesPerfilAtual = [];
                    return [];
                }).catch((err) => {
                    permissoesPerfilAtual = [];
                    return [];
                });
            }

            function extrairPrefixoCodigo(codigo) {
                const c = String(codigo || '').trim().toLowerCase();
                if (!c) return '';
                return c.split(':')[0] || c;
            }

            function extrairAcaoCodigo(codigo) {
                const c = String(codigo || '').trim().toLowerCase();
                if (!c || !c.includes(':')) return '';
                return c.split(':')[1] || '';
            }

            function carregarOrdemRecursosMenu() {
                return fetch('/page/nav.json')
                    .then(res => res.json())
                    .then(data => {
                        const menu = (data && Array.isArray(data.menu)) ? data.menu : [];

                        const chaves = [];
                        const mapaAcoes = {};

                        const addKey = (key) => {
                            if (!key) return;
                            const prefixo = extrairPrefixoCodigo(key);
                            const acao = extrairAcaoCodigo(key);

                            if (prefixo) {
                                chaves.push(prefixo);
                            }

                            if (!prefixo || !acao) return;

                            if (!mapaAcoes[prefixo]) {
                                mapaAcoes[prefixo] = [];
                            }

                            if (!mapaAcoes[prefixo].includes(acao)) {
                                mapaAcoes[prefixo].push(acao);
                            }
                        };

                        menu.forEach(item => {
                            if (item?.key) {
                                addKey(item.key);
                            }
                            if (Array.isArray(item?.dropdown)) {
                                item.dropdown.forEach(subItem => {
                                    if (subItem?.key) {
                                        addKey(subItem.key);
                                    }
                                });
                            }
                        });

                        ordemChavesMenu = Array.from(new Set(chaves.filter(Boolean)));
                        ordemAcoesPorPrefixo = mapaAcoes;
                        return ordemChavesMenu;
                    })
                    .catch(() => {
                        ordemChavesMenu = [];
                        ordemAcoesPorPrefixo = {};
                        return [];
                    });
            }

            function compararPermissoesPorNavEMetodo(a, b) {
                const aPrefixo = extrairPrefixoCodigo(a?.codigo);
                const bPrefixo = extrairPrefixoCodigo(b?.codigo);

                const idxPrefixoA = ordemChavesMenu.indexOf(aPrefixo);
                const idxPrefixoB = ordemChavesMenu.indexOf(bPrefixo);

                const rankPrefixoA = idxPrefixoA === -1 ? Number.MAX_SAFE_INTEGER : idxPrefixoA;
                const rankPrefixoB = idxPrefixoB === -1 ? Number.MAX_SAFE_INTEGER : idxPrefixoB;

                if (rankPrefixoA !== rankPrefixoB) {
                    return rankPrefixoA - rankPrefixoB;
                }

                const aAcao = extrairAcaoCodigo(a?.codigo);
                const bAcao = extrairAcaoCodigo(b?.codigo);
                const ordemAcoes = ordemAcoesPorPrefixo[aPrefixo] || [];

                const idxAcaoA = ordemAcoes.indexOf(aAcao);
                const idxAcaoB = ordemAcoes.indexOf(bAcao);
                const rankAcaoA = idxAcaoA === -1 ? Number.MAX_SAFE_INTEGER : idxAcaoA;
                const rankAcaoB = idxAcaoB === -1 ? Number.MAX_SAFE_INTEGER : idxAcaoB;

                if (rankAcaoA !== rankAcaoB) {
                    return rankAcaoA - rankAcaoB;
                }

                const rankMetodoA = ordemMetodo(a?.metodo);
                const rankMetodoB = ordemMetodo(b?.metodo);
                if (rankMetodoA !== rankMetodoB) {
                    return rankMetodoA - rankMetodoB;
                }

                return String(a?.descricao || '').localeCompare(String(b?.descricao || ''));
            }

            function ordenarRecursos(recursos, permissoesPorRecurso) {
                const indiceChaveMenu = (prefixo) => {
                    if (!prefixo) return -1;
                    return ordemChavesMenu.indexOf(prefixo);
                };

                const rankRecurso = (recurso) => {
                    const permissoesDoRecurso = Array.isArray(permissoesPorRecurso?.[recurso])
                        ? permissoesPorRecurso[recurso]
                        : [];

                    let melhorIndice = Number.MAX_SAFE_INTEGER;
                    permissoesDoRecurso.forEach(permissao => {
                        const prefixo = extrairPrefixoCodigo(permissao?.codigo);
                        const idx = indiceChaveMenu(prefixo);
                        if (idx !== -1 && idx < melhorIndice) {
                            melhorIndice = idx;
                        }
                    });

                    if (melhorIndice !== Number.MAX_SAFE_INTEGER) {
                        return melhorIndice;
                    }

                    const recursoNorm = normalizarRecurso(recurso);
                    const idxPorNome = ordemChavesMenu.findIndex(chave => {
                        const chaveNorm = normalizarRecurso(chave);
                        return recursoNorm.includes(chaveNorm) || chaveNorm.includes(recursoNorm);
                    });

                    if (idxPorNome !== -1) {
                        return idxPorNome;
                    }

                    return 9999;
                };

                return (recursos || []).sort((a, b) => {
                    const rankA = rankRecurso(a);
                    const rankB = rankRecurso(b);
                    if (rankA !== rankB) return rankA - rankB;
                    return a.localeCompare(b);
                });
            }

            function montarPermissoesPorRecurso(lista) {
                const mapa = {};
                (lista || []).forEach(item => {
                    const recurso = String(item.recurso || '').trim();
                    const permissoes = Array.isArray(item.permissoes) ? item.permissoes : [item];
                    permissoes.forEach(permissao => {
                        if (!permissao || permissao.id == null) return;
                        if (!mapa[recurso]) mapa[recurso] = [];
                        mapa[recurso].push({
                            ...permissao,
                            id: Number(permissao.id),
                            recurso: permissao.recurso || recurso
                        });
                    });
                });
                return mapa;
            }

            function normalizarPermissoesPerfil(data) {
                if (!data) return [];

                if (Array.isArray(data)) {
                    const flat = normalizarListaPermissoes(data);
                    if (flat.length > 0) {
                        return flat.map(p => ({
                            ...p,
                            vinculada: Boolean(p.vinculada ?? true)
                        }));
                    }
                }

                if (typeof data === 'object') {
                    const flat = normalizarListaPermissoes(data);
                    if (flat.length > 0) {
                        return flat.map(p => ({
                            ...p,
                            vinculada: Boolean(p.vinculada ?? true)
                        }));
                    }

                    const permissoesVinculadas = extrairMapaPermissoesVinculadas(data);
                    return (todasPermissoes || []).map(p => ({
                        ...p,
                        vinculada: Boolean(permissoesVinculadas[p.codigo])
                    }));
                }

                return [];
            }

            function criarSubgrupoPermissoes(titulo, permissoes, options = {}) {
                const fragment = $(document.createDocumentFragment());

            function montarContextoPermissoes(listaBase) {
                const permissoesPorRecurso = montarPermissoesPorRecurso(listaBase);
                const recursos = ordenarRecursos(Object.keys(permissoesPorRecurso), permissoesPorRecurso);
                const chaveGarantia = recursos.find(r => normalizarRecurso(r).includes('garantia'));
                const chaveMateriaPrima = recursos.find(r => {
                    const norm = normalizarRecurso(r);
                    return norm.includes('materia') && norm.includes('prima');
                });
                const permissoesEtapa = listaBase.filter(p => {
                    const codigo = String(p.codigo || '').toLowerCase();
                    return codigo.startsWith('etapa:') || codigo.startsWith('etapa_mp:');
                });
                const recursosEtapa = new Set(
                    recursos.filter(r => (permissoesPorRecurso[r] || []).some(p => {
                        const codigo = String(p.codigo || '').toLowerCase();
                        return codigo.startsWith('etapa:') || codigo.startsWith('etapa_mp:');
                    }))
                );
                const chaveProjeto = recursos.find(r => (permissoesPorRecurso[r] || []).some(p => String(p.codigo || '').toLowerCase().startsWith('projeto:')))
                    || recursos.find(r => normalizarRecurso(r).includes('projet'));

                const gruposSistema = {
                    usuarios: [],
                    controleacesso: [],
                    configuracoesimpressao: []
                };

                const recursosGerais = [];

                recursos.forEach(recurso => {
                    if (recurso === 'Elementos' || recurso === 'elemento' || recurso === 'Rotas') {
                        return;
                    }

                    if (chaveGarantia && chaveMateriaPrima && recurso === chaveGarantia) {
                        return;
                    }

                    if (chaveProjeto && recursosEtapa.has(recurso) && recurso !== chaveProjeto) {
                        return;
                    }

                    const grupoSistema = identificarGrupoSistema(recurso);
                    if (grupoSistema) {
                        gruposSistema[grupoSistema] = gruposSistema[grupoSistema].concat(permissoesPorRecurso[recurso] || []);
                        return;
                    }

                    recursosGerais.push(recurso);
                });

                return {
                    permissoesPorRecurso,
                    chaveGarantia,
                    chaveMateriaPrima,
                    permissoesEtapa,
                    chaveProjeto,
                    gruposSistema,
                    recursosGerais
                };
            }

            function renderizarPermissoesNoContainer(config = {}) {
                const container = $(config.containerSelector);
                const listaBase = getListaBasePermissoes();

                if (listaBase.length === 0) {
                    exibirAlertaSemPermissoes(container);
                    return;
                }

                const contexto = montarContextoPermissoes(listaBase);
                const temSistema = Object.values(contexto.gruposSistema).some(lista => lista.length > 0);

                container.empty();

                contexto.recursosGerais.forEach(recurso => {
                    const recursoDiv = $('<div>').addClass('mb-3 recurso-bloco');
                    recursoDiv.append(criarCabecalhoRecurso(recurso, config.checkboxClass, config.readonly));

                    const permissoesDoRecurso = (contexto.chaveProjeto && recurso === contexto.chaveProjeto)
                        ? (contexto.permissoesPorRecurso[recurso] || []).filter(p => {
                            const codigo = String(p.codigo || '').toLowerCase();
                            return !codigo.startsWith('etapa:') && !codigo.startsWith('etapa_mp:');
                        })
                        : (contexto.permissoesPorRecurso[recurso] || []);

                    recursoDiv.append(criarLinhaPermissoes(permissoesDoRecurso, config));

                    if (contexto.chaveGarantia && contexto.chaveMateriaPrima && recurso === contexto.chaveMateriaPrima && contexto.permissoesPorRecurso[contexto.chaveGarantia]) {
                        recursoDiv.append(criarSubgrupoPermissoes('Garantias', contexto.permissoesPorRecurso[contexto.chaveGarantia], config));
                    }

                    if (contexto.chaveProjeto && recurso === contexto.chaveProjeto && contexto.permissoesEtapa.length > 0) {
                        recursoDiv.append(criarSubgrupoPermissoes('Etapas', contexto.permissoesEtapa, config));
                    }

                    container.append(recursoDiv);
                });

                if (temSistema) {
                    const sistemaDiv = $('<div>').addClass('mb-3 recurso-bloco');
                    sistemaDiv.append(criarCabecalhoRecurso('Configurações de Sistema', config.checkboxClass, config.readonly));

                            : contexto.gruposSistema[grupo];

                        sistemaDiv.append(criarSubgrupoPermissoes(tituloGrupoSistema(grupo), permissoesGrupo, config));
                    });

                    container.append(sistemaDiv);
                }

                atualizarEstadoMarcarTodos(container, config.checkboxClass);
            }

                                perfilId,
                                permissoesIds: permissoesSelecionadas
                            }).then(() => carregarPermissoesDoPerfil(perfilId));
                        })
                        .then(resultPermissoes => {
                            if (resultPermissoes && resultPermissoes.success === false) {
                                showToast(resultPermissoes.message || 'Erro ao salvar permissões.', 'error');
                                return;
                            }

                            atualizarPerfilLocal(perfilId, jsonData);

                            $(`${SELECTORS.detalhesPerfil} #nome`).val(jsonData.nome);
                            $(`${SELECTORS.detalhesPerfil} #descricao`).val(jsonData.descricao);
                            definirModoEdicaoDetalhes(false);
                            renderizarPermissoes(perfilId, true);
                            showToast('Perfil atualizado com sucesso!', 'success');
                            setTimeout(() => {
                                $(SELECTORS.detalhesModal).modal('hide');
                            }, 1800);
                            alterado = 1;
                        })
                        .catch(error => {
                            showToast('Erro de comunicação: ' + (error.message || 'Erro desconhecido.'), 'error');
                        });
                });

                // Limpa modal ao fechar
                $(SELECTORS.detalhesModal).on('hidden.bs.modal', function () {
                    $(SELECTORS.detalhesPerfil).empty();
                    $(SELECTORS.permissoesContainer).empty().hide();
                    definirModoEdicaoDetalhes(false);
                    permissoesPerfilAtual = [];
                });

                ///////////////FIM EDITAR///////////////////////

                ///////////////EXCLUIR///////////////////////
                $(SELECTORS.tabelaPerfis).on('click', '.btn-excluir', function () {
                    const id = $(this).data('id');
                    const nome = $(this).data('nome');
                    excluirPerfil(id, nome);
                });

                function excluirPerfil(id, nome) {
                    if (id == 1) {
                        showToast("Não é permitido excluir o perfil ADMINISTRADOR!", 'error');
                        return;
                    }

                    $('#nomeExclui').text(nome);
                    $(SELECTORS.confirmacaoExclusaoModal).modal('show');

                    $('#confirmarExclusao').off('click').on('click', function () {
                        req_DELETE(opt.urlPerfis + "/" + id).then((result) => {
                            if (!result.success) {
                                showToast(getMensagemErro(result), 'error');
                                return;
                            }

                            $(SELECTORS.confirmacaoExclusaoModal).modal('hide');
                            showToast('Perfil excluído com sucesso!', 'success');
                            alterado = 1;
                        }).catch(error => {
                            showToast('Erro de comunicação: ' + (error.message || 'Erro desconhecido.'), 'error');
                        });
                    });
                }

                // FUNÇÕES AUXILIARES
                $('.modal').on('hidden.bs.modal', function () {
                    if (alterado !== 0) {
                        recarregarTabelaPerfis();
                    }
                });

            }).catch(error => {
                showToast('Erro ao carregar perfis: ' + (error.message || 'Erro desconhecido.'), 'error');
            });

        } catch (globalError) {
            showToast('Erro ao inicializar: ' + globalError.message, 'error');
        }
    });
</script>
